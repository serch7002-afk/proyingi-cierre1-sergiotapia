<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
<title id="title">Vista acotada de señal triangular para maqueta</title>
<desc id="desc">Esquema preliminar con triángulo de 80 por 69 milímetros, base de 40 por 20 milímetros y ranura de 3.2 por 18 milímetros. No es una captura CAD ni una pieza fabricada.</desc>
