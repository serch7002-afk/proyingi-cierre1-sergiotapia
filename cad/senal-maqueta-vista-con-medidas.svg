<text x="532" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#1769aa">profundidad 18 mm</text>
<text x="450" y="505" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#333">Propuesta de MDF 3 mm (sujeta a aprobación del FabLab)</text>
